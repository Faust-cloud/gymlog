<style>
:root{--bg:#f2f2f7;--card:#fff;--card2:#ececf1;--text:#0b0b0f;--sub:#55555f;--line:#cfcfd8;--acc:#0a6cff;--ok:#178a46;--danger:#d92d20;--warn:#a85f00;--cur:#e3eeff;--tab:rgba(250,250,252,.94);color-scheme:light dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;-webkit-text-size-adjust:100%}

body{overscroll-behavior-y:none}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{touch-action:manipulation;cursor:pointer}
button:disabled{opacity:.35}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;min-height:52px;padding:calc(env(safe-area-inset-top) + 6px) max(16px,env(safe-area-inset-right)) 6px max(16px,env(safe-area-inset-left))}
h1{font-size:24px;margin:0;font-weight:800}
h2{font-size:17px;margin:18px 4px 6px}
main{overflow-x:clip;padding:0 max(12px,env(safe-area-inset-right)) calc(84px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}

/* 键盘弹出时收起底部固定栏，避免它们浮到键盘上方挡住输入框 */
body.kb nav.tabs,body.kb #timer{display:none!important}
body.kb main{padding-bottom:24px}
#hpill{display:none;margin-left:8px;padding:4px 10px;border-radius:12px;background:var(--acc);color:#fff;font-weight:700;font-variant-numeric:tabular-nums}
body.timer-on.kb #hpill{display:inline-block}
.hright{display:flex;align-items:center}
.btn{min-height:44px;min-width:44px;border:0;border-radius:12px;font-size:16px;font-weight:600;background:var(--card2);color:var(--text);padding:0 14px}
.btn.pri{background:var(--acc);color:#fff}
.btn.danger{color:var(--danger)}
.btn.pri.danger,.btn.fill-danger{background:var(--danger);color:#fff}
.btn.big{display:block;width:100%;min-height:56px;font-size:18px;margin-top:10px}
.btn.ghost{background:none;color:var(--sub);font-weight:500}
.card{background:var(--card);border-radius:16px;padding:12px;margin:10px 0}
.exh{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.exh>div:first-child,.li>div:first-child{min-width:0;overflow-wrap:anywhere}
.exn{font-size:19px;font-weight:800}
.exb{display:flex;gap:4px;flex-shrink:0}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:1px 6px;border-radius:6px;background:var(--card2);color:var(--sub);vertical-align:middle}
.sub{color:var(--sub);font-size:14px}
.set{display:grid;grid-template-columns:minmax(0,1fr) 66px;gap:6px 8px;padding:8px;border-radius:12px;border:2px solid transparent;margin-top:8px;background:var(--card2)}
.set.cur{border-color:var(--acc);background:var(--cur);scroll-margin:70px 0 170px}
/* 热身组：橙色虚线边框，一眼和正式组区分开 */
.set.warm{border:2px dashed var(--warn)}
.set.warm .sethead>span:first-child,.set.mini.warm .mini-main{color:var(--warn)}
.sethead{flex-wrap:wrap;gap:0 4px}
.warmbtn{padding:0 8px}
.set.done .chk{background:var(--ok);color:#fff}
/* 已完成的组折叠成一行，点一下展开修改 */
.set.mini{display:flex;align-items:center;gap:8px;padding:4px 4px 4px 0;background:none;border:1px solid var(--line)}
.mini-main{flex:1;min-width:0;min-height:44px;border:0;background:none;text-align:left;padding:0 10px;color:var(--sub);font-size:15px}
.mini-main b{color:var(--text);font-size:17px;margin-left:6px}
.mini-ok{width:48px;min-width:48px;padding:0;background:var(--ok);color:#fff;font-size:18px}
.prev{font-weight:500;color:var(--sub);font-size:13px;margin-left:8px}
.set.mini.warm{border:1px dashed var(--warn)}
.sethead{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;font-weight:700;padding-left:4px}
.stp{grid-column:1;display:flex;align-items:center;gap:5px}

.stp .btn{padding:0;width:50px;min-width:50px;font-size:15px;background:var(--card)}
.unit{width:20px;color:var(--sub);font-size:13px;flex-shrink:0}
.chk{grid-column:2;grid-row:2/4;min-height:94px;font-size:16px;line-height:1.3;background:var(--card);border:2px solid var(--ok)!important;color:var(--ok)}
input.bad{border-color:var(--danger)!important;box-shadow:0 0 0 2px var(--danger)}
.addset{width:100%;margin-top:8px;border:1px dashed var(--line);background:none}

#timer{display:none;position:fixed;z-index:19;left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));bottom:calc(64px + env(safe-area-inset-bottom));background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 6px 0 0;box-shadow:0 4px 16px rgba(0,0,0,.2);overflow:hidden}
body.timer-on #timer{display:block}
#timer .row{display:flex;gap:6px;align-items:center;min-height:58px}
.tnum{flex:1;min-width:0;border:0;background:none;text-align:left;padding:4px 10px;line-height:1.1}
.tnum span{display:block;font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.tlab{font-size:12px;color:var(--sub);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#timer .row .btn{padding:0 10px;flex-shrink:0}
.prog{position:absolute;left:0;right:0;top:0;height:4px;background:var(--line)}
.prog i{display:block;height:100%;width:0;background:var(--acc)}
.chips{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.chip{flex-shrink:0;min-height:44px;min-width:56px;border-radius:22px;border:1px solid var(--line);background:var(--card2);font-size:15px;font-weight:600;padding:0 12px}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
#timer.alarm{animation:fl .6s steps(2,jump-none) infinite;border-color:transparent}
#timer.alarm .tlab,#timer.alarm .tnum{color:inherit}
@keyframes fl{0%{background:var(--danger);color:#fff}100%{background:var(--warn);color:#000}}
#flash{position:fixed;inset:0;z-index:18;pointer-events:none;opacity:0;background:var(--danger)}
#flash.go{animation:fl2 .5s ease-in-out 5}
@keyframes fl2{0%,100%{opacity:0}50%{opacity:.35}}
/* 弹层跟随“可见视口”定位：键盘弹出时整体上移，不会被键盘挡住 */
.ov{position:fixed;left:0;right:0;top:var(--vvt,0px);height:var(--vvh,100%);z-index:50;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;overscroll-behavior:contain}
.ov.c{align-items:center;justify-content:center;padding:24px}
.sheet{background:var(--bg);width:100%;max-height:calc(var(--vvh,100vh) - 36px);border-radius:18px 18px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.sheet.full{height:100%;max-height:none;border-radius:0;padding-top:env(safe-area-inset-top)}
.sb{overscroll-behavior:contain}
input[type="datetime-local"]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;text-align:left;line-height:46px}
.sh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
.sh b{font-size:18px}
.sb{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 12px 24px;flex:1}
.dlg{background:var(--card);border-radius:18px;padding:20px;width:100%;max-width:360px;max-height:85vh;overflow-y:auto}
.dlg h3{margin:0 0 8px;font-size:19px}
.dlg p{margin:0;white-space:pre-line}
.bts{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.bts .btn{min-height:50px}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translateX(-50%);z-index:100;background:rgba(30,30,34,.96);color:#fff;padding:12px 16px;border-radius:14px;max-width:90%;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;text-align:center}
#toast.show{opacity:1}
#toast.err{background:var(--danger)}
.li{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:54px;padding:10px 12px;background:var(--card);border:0;border-radius:14px;margin:8px 0;font-size:16px;text-align:left}
.li .t{font-weight:700}
.tip{background:var(--cur);border-radius:14px;padding:14px;margin:10px 0}
.tip.warn{background:transparent;border:2px solid var(--warn)}
.tip ol{margin:8px 0 0;padding-left:22px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.stat{background:var(--card2);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;gap:3px;margin:10px 0}
.seg button{flex:1;min-height:44px;border:0;background:none;border-radius:10px;font-size:14px;font-weight:600;padding:0 4px}
.seg button.on{background:var(--card);color:var(--acc);box-shadow:0 1px 4px rgba(0,0,0,.15)}
select,.txt{width:100%;min-height:48px;font-size:16px;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:0 12px}
.lbl{display:block;font-weight:700;margin:14px 0 6px}
.chkrow{display:flex;align-items:center;gap:10px;min-height:48px;font-size:16px}
.chkrow input{width:24px;height:24px}
canvas{display:block;width:100%;height:260px;touch-action:manipulation}
.cinfo{min-height:44px;padding:8px 4px;font-weight:600}
.row2{display:flex;gap:8px}
.row2 .btn{flex:1}
.exline{padding:6px 0;border-bottom:1px solid var(--line)}
.exline:last-child{border-bottom:0}
/* 统计页 */
.catrow{display:flex;align-items:center;gap:10px;margin:9px 0}
.catname{width:44px;flex-shrink:0;font-size:14px;font-weight:700}
.catbar{flex:1;height:10px;border-radius:5px;background:var(--card2);overflow:hidden}
.catbar i{display:block;height:100%;background:var(--acc);border-radius:5px;transition:width .25s}
.catnum{width:52px;flex-shrink:0;text-align:right;font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.wkchart{display:flex;align-items:stretch;gap:5px;height:132px}
.wkbar{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.wkfill{flex:1;width:100%;display:flex;align-items:flex-end}
.wkfill i{width:100%;background:var(--acc);border-radius:5px 5px 2px 2px;min-height:2px}
.wknum,.wklab{font-size:10px;color:var(--sub);white-space:nowrap;font-variant-numeric:tabular-nums;height:13px;line-height:13px}
</style>

<body>
<header class="top"><h1 id="title">训练</h1><div class="hright"><span id="hdr" class="sub"></span><span id="hpill"></span></div></header>
<main id="main"></main>

<div id="timer">
  <div class="prog"><i id="tprog"></i></div>
  <div class="row">
    <button class="tnum" data-a="restPick"><div class="tlab" id="tlab">组间休息 · 点此改时长</div><span id="tnum">1:30</span></button>
    <button class="btn" data-a="tadj" data-d="-15" aria-label="减 15 秒">−15</button>
    <button class="btn" data-a="tadj" data-d="15" aria-label="加 15 秒">+15</button>
    <button class="btn pri" data-a="tskip" id="tskip">跳过</button>

</div>

  <button data-a="tab" data-tab="train"><svg viewBox="0 0 24 24"><path d="M6 6v12M18 6v12M3 9.5v5M21 9.5v5M6 12h12"/></svg>训练</button>
  <button data-a="tab" data-tab="history"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>历史</button>

  <button data-a="tab" data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>设置</button>

<script>
'use strict';
/* ========== 数据层 ========== */
const KEY = 'gymlog_v1', VER = 1, DAY = 864e5;
const CATS = ['胸', '背', '腿', '肩', '手臂', '核心'];
const BUILTIN = [
  ['胸','杠铃卧推'],['胸','上斜杠铃卧推'],['胸','哑铃卧推'],['胸','上斜哑铃卧推'],['胸','哑铃飞鸟'],['胸','绳索夹胸'],['胸','双杠臂屈伸'],
  ['背','引体向上'],['背','高位下拉'],['背','杠铃划船'],['背','坐姿划船'],['背','单臂哑铃划船'],['背','硬拉'],
  ['腿','杠铃深蹲'],['腿','腿举'],['腿','罗马尼亚硬拉'],['腿','箭步蹲'],['腿','腿屈伸'],['腿','腿弯举'],['腿','提踵'],
  ['肩','杠铃推举'],['肩','哑铃推举'],['肩','侧平举'],['肩','面拉'],['肩','反向飞鸟'],
  ['手臂','杠铃弯举'],['手臂','哑铃弯举'],['手臂','锤式弯举'],['手臂','绳索下压'],['手臂','窄距卧推'],
  ['核心','卷腹'],['核心','悬垂举腿'],['核心','平板支撑']
];
const BW = new Set(['双杠臂屈伸', '引体向上', '卷腹', '悬垂举腿', '平板支撑']);
const builtins = () => BUILTIN.map(([cat, name], i) => ({ id: 'b' + (i + 1), name, cat, bw: BW.has(name), timed: name === '平板支撑', custom: false }));
const defState = () => ({ version: VER, exercises: builtins(), workouts: [], active: null, timer: null, settings: { rest: 90, lastBackup: null, sound: 'bg' } });

// 以后升级数据结构时在这里按 version 逐级迁移
function migrate(d) {
  if (!d || typeof d !== 'object') throw new Error('数据格式错误');
  const s = defState();
  if (Array.isArray(d.exercises)) s.exercises = d.exercises;
  builtins().forEach(b => { if (!s.exercises.some(e => e.id === b.id)) s.exercises.push(b); });
  if (Array.isArray(d.workouts)) s.workouts = d.workouts;
  s.active = d.active || null;
  s.timer = d.timer || null;
  s.settings = Object.assign(s.settings, d.settings || {});
  s.version = VER;
  return s;
}

let S, saveWarned = 0;
function load() {
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch (e) { setTimeout(() => ask('无法读取本地存储', '浏览器禁止了本地存储（可能是无痕模式）。本次记录无法保存，请换用普通模式打开。'), 300); return defState(); }
  if (!raw) return defState();
  try { return migrate(JSON.parse(raw)); }
  catch (e) {
    try { localStorage.setItem(KEY + '_corrupt_' + Date.now(), raw); } catch (_) {}
    setTimeout(() => ask('数据读取失败', '本地数据已损坏，已另存一份原始数据。你可以从备份文件导入恢复。'), 300);
    return defState();
  }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); return true; }
  catch (e) {
    if (Date.now() - saveWarned > 8000) { saveWarned = Date.now(); ask('保存失败', '存储空间可能已满或被禁用，刚才的修改没有写入本地。\n请先到「设置」导出备份，再清理旧数据。'); }
    return false;
  }
}
// 事务式保存：失败时回滚内存数据，避免“看起来存了其实没存”
function tx(fn) { const bak = JSON.stringify(S); fn(); if (!save()) { S = JSON.parse(bak); return false; } return true; }

/* ========== 工具函数 ========== */
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const p2 = n => String(n).padStart(2, '0');
const num = n => Math.round(n * 100) / 100;
const exById = id => S.exercises.find(e => e.id === id) || { id, name: '未知动作', cat: '', bw: false, timed: false };
const fmtMD = t => { const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()}`; };
const fmtDate = t => { const d = new Date(t); return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`; };
const WK = '日一二三四五六';
const fmtDT = t => { const d = new Date(t); return `${fmtDate(t)} 周${WK[d.getDay()]} ${p2(d.getHours())}:${p2(d.getMinutes())}`; };
const fmtDur = ms => { const m = Math.max(1, Math.round(ms / 60000)); return m >= 60 ? `${Math.floor(m / 60)}小时${m % 60}分` : `${m}分钟`; };
const fmtClock = ms => { const s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600); return (h ? h + ':' + p2(Math.floor(s / 60) % 60) : Math.floor(s / 60)) + ':' + p2(s % 60); };
const fmtW = (ex, w) => ex.bw ? (w > 0 ? '自重+' + num(w) : '自重') : String(num(w));
const fmtSet = (ex, s) => ex.timed ? (s.w > 0 ? '+' + num(s.w) + 'kg ' : '') + s.r + '秒' : fmtW(ex, s.w) + '×' + s.r;
const fmtKg = v => num(v).toLocaleString('zh-CN') + ' kg';
function parseW(v) { v = String(v).trim().replace(/,|，/g, '.'); if (!/^\d+(\.\d+)?$/.test(v)) return null; const n = Number(v); return n <= 1000 ? num(n) : null; }
function parseR(v) { v = String(v).trim(); if (!/^\d+$/.test(v)) return null; const n = Number(v); return n >= 1 && n <= 36000 ? n : null; }
function stats(w) {
  let v = 0, n = 0;
  w.exercises.forEach(e => { const ex = exById(e.exId); e.sets.forEach(s => { if (!s.done || s.warm) return; n++; if (!ex.timed) v += s.w * s.r; }); });
  return { v: num(v), n, ex: w.exercises.filter(e => e.sets.some(s => s.done)).length };
}
const sortW = () => S.workouts.sort((a, b) => b.start - a.start);
// 某动作的上次成绩：取 before 之前最近一次有已完成组的训练
function lastPerf(exId, before, skipId) {
  for (const w of S.workouts) {
    if (w.id === skipId || (before && w.start >= before)) continue;
    const sets = w.exercises.filter(e => e.exId === exId).flatMap(e => e.sets.filter(s => s.done && !s.warm));
    if (sets.length) return { date: w.start, sets };
  }
  return null;
}
function usage(exId) {
  return S.workouts.filter(w => w.exercises.some(e => e.exId === exId)).length + (S.active && S.active.exercises.some(e => e.exId === exId) ? 1 : 0);
}

/* ========== 提示、对话框、弹出面板 ========== */
let toastT;
function toast(msg, err) { const t = $('#toast'); t.textContent = msg; t.className = 'show' + (err ? ' err' : ''); clearTimeout(toastT); toastT = setTimeout(() => t.className = '', msg.length > 30 ? 4500 : 2600); }
// 弹层打开时锁住背后的页面，关掉最后一个弹层时解锁
const lockBody = () => document.body.classList.add('lock');
const unlockBody = () => { if (!document.querySelector('.ov')) document.body.classList.remove('lock'); };
// buttons: [[文字, 返回值, 样式]]；点遮罩返回 null
function ask(title, msg, buttons = [['知道了', 'ok', 'pri']], extra = '') {
  return new Promise(res => {
    const ov = document.createElement('div'); ov.className = 'ov c';
    ov.innerHTML = `<div class="dlg" role="dialog"><h3>${esc(title)}</h3>${msg ? `<p>${esc(msg)}</p>` : ''}${extra}<div class="bts">${buttons.map(([t, v, c]) => `<button class="btn ${c || ''}" data-v="${v}">${esc(t)}</button>`).join('')}</div></div>`;
    const done = v => { ov.remove(); unlockBody(); res(v); };
    ov.addEventListener('click', e => { if (e.target === ov) return done(null); const b = e.target.closest('[data-v]'); if (b) done(b.dataset.v === 'input' ? ov.querySelector('input').value : b.dataset.v); });
    document.body.appendChild(ov); lockBody();
    const inp = ov.querySelector('input'); if (inp) setTimeout(() => inp.focus(), 50);
  });
}
const confirmDanger = (title, msg, ok = '删除') => ask(title, msg, [[ok, 'ok', 'fill-danger'], ['取消', 'no']]).then(v => v === 'ok');
function sheet(title, right = '', full = false) {
  const ov = document.createElement('div'); ov.className = 'ov';
  ov.innerHTML = `<div class="sheet ${full ? 'full' : ''}"><div class="sh"><button class="btn ghost" data-x="close">${full ? '取消' : '关闭'}</button><b>${esc(title)}</b><span>${right || '<span style="width:60px;display:inline-block"></span>'}</span></div><div class="sb"></div></div>`;
  ov.close = () => { ov.remove(); unlockBody(); };
  ov.addEventListener('click', e => { if (e.target === ov || e.target.closest('[data-x="close"]')) ov.close(); });
  document.body.appendChild(ov); lockBody();
  ov.body = ov.querySelector('.sb');
  return ov;
}
/* ========== 训练页与训练编辑器 ========== */

  const prs = prMap(w);

    const cur = m === 'a' ? e.sets.findIndex(s => !s.done) : -1, labs = setLabels(e.sets);

      <div class="exh"><div><div class="exn">${esc(ex.name)}${ex.bw ? ' <span class="tag">自重</span>' : ''}${ex.timed ? ' <span class="tag">计时</span>' : ''}</div>

// 热身组不占正式组号：热身、热身、第 1 组、第 2 组…
const setLabels = sets => { let k = 0; return sets.map(s => s.warm ? '热身' : `第 ${++k} 组`); };

    <div class="stp"><label>${ex.bw ? '负重' : '重量'}</label><button class="btn" data-a="step" data-f="w" data-d="-2.5">−2.5</button><input data-f="w" inputmode="decimal" autocomplete="off" value="${num(s.w)}" aria-label="重量"><button class="btn" data-a="step" data-f="w" data-d="2.5">+2.5</button><span class="unit">kg</span></div>

    <button class="btn chk" data-a="done">${s.done ? '✓<br>已完成' : '完成<br>✓'}</button></div>`;

// 根据点击位置找到对应的训练、动作、组
function ctx(el) {

  const ce = el.closest('[data-ei]'), cs = el.closest('[data-si]');
  const ei = ce ? +ce.dataset.ei : -1, si = cs ? +cs.dataset.si : -1;
  const e = w && ei >= 0 ? w.exercises[ei] : null;

// 重绘后把被点的动作卡片放回原来的屏幕位置，页面不会突然跳走
function commit(m, anchor, key) {
  const scroller = m === 'e' ? editOv && editOv.body : null;
  const card = anchor && anchor.closest && anchor.closest('.card[data-ei]');
  const k = key != null ? key : card ? card.dataset.ei : null, top = card ? card.getBoundingClientRect().top : 0;
  if (m === 'a') { touchActive(); save(); if (tab === 'train') rTrain(); } else rEdit();
  if (k == null || !card) return;
  const n = document.querySelector(`.card[data-m="${m}"][data-ei="${k}"]`); if (!n) return;

const renum = e => e.sets.forEach((s, i) => s.n = i + 1);

}

const A = {}; // 所有点击动作
A.tab = b => { tab = b.dataset.tab; window.scrollTo(0, 0); render(); };
A.start = () => { S.active = { id: uid(), start: Date.now(), end: null, exercises: [] }; save(); rTrain(); setTimeout(() => A.addEx($('[data-a="addEx"]')), 50); };
/* ========== 忘记结束训练：很久没操作就自动结束 ==========
   超过设定时长（默认 10 分钟）没有任何操作，下次看到这个页面时直接结束这次训练：
   结束时间按最后一组点“完成”的时间算，没点完成的组不保存；弹窗里可以一键撤销。 */
const idleMin = () => (S.settings.idleMin === undefined ? 10 : S.settings.idleMin);
const idleLimit = () => idleMin() ? idleMin() * 60000 : Infinity;
const touchActive = () => { if (S.active) S.active.last = Date.now(); };
const lastAct = w => w.last || w.start;
const lastDone = w => Math.max(0, ...w.exercises.flatMap(e => e.sets.map(s => s.t || 0)));
// 结束时间：停了很久就用最后一组的完成时间；旧版本记的训练没有时间信息，按每组约 3 分钟估算
function endTime(w) {
  const now = Date.now();
  if (now - lastAct(w) < idleLimit()) return now;
  const t = lastDone(w) || w.last;
  if (t) return t;
  const n = w.exercises.reduce((a, e) => a + e.sets.filter(s => s.done).length, 0);
  return Math.min(now, w.start + Math.max(10, n * 3) * 60000);
}
const fmtHM = t => { const d = new Date(t); return (new Date().toDateString() === d.toDateString() ? '今天 ' : fmtMD(t) + ' ') + p2(d.getHours()) + ':' + p2(d.getMinutes()); };
const fmtAgo = ms => { const m = Math.floor(ms / 60000); return m >= 60 ? `${Math.floor(m / 60)} 小时 ${m % 60} 分钟` : `${m} 分钟`; };
function autoEnd() {
  const w = S.active;
  if (!w || document.hidden || document.querySelector('.ov') || document.body.classList.contains('kb')) return;
  if (S.timer && S.timer.end > Date.now()) return;           // 还在组间休息，不算没动静
  const idle = Date.now() - lastAct(w);
  if (idle < idleLimit()) return;
  const snap = JSON.parse(JSON.stringify(w)), estimated = !lastDone(w) && !w.last;
  const saved = JSON.parse(JSON.stringify(w));
  saved.exercises.forEach(e => { e.sets = e.sets.filter(s => s.done); renum(e); });
  saved.exercises = saved.exercises.filter(e => e.sets.length);
  saved.end = endTime(w); delete saved.last;
  const keep = saved.exercises.length > 0;
  if (!tx(() => { if (keep) { S.workouts.push(saved); sortW(); } S.active = null; S.timer = null; })) return;
  restAudio(0); alarmOff(); openSet = null; render();
  const msg = keep
    ? `已经 ${fmtAgo(idle)}没有操作，这次训练已自动结束并保存。\n结束时间：${fmtHM(saved.end)}${estimated ? '（旧记录没有时间信息，这是按组数估算的，可以到「历史」里改）' : '（最后一组完成的时间）'}\n共 ${fmtDur(saved.end - saved.start)}，${stats(saved).n} 组。没点「完成」的组没有保存。`
    : `已经 ${fmtAgo(idle)}没有操作，这次训练没有完成任何一组，已自动放弃。`;
  ask('已自动结束训练', msg, [['好的', 'ok', 'pri'], ['撤销，我还在练', 'undo']]).then(v => {
    if (v !== 'undo' || S.active) return;
    if (tx(() => { S.workouts = S.workouts.filter(x => x.id !== snap.id); S.active = snap; S.active.last = Date.now(); })) { tab = 'train'; render(); toast('已恢复，继续训练'); }
  });
}
A.addEx = b => {
  const m = b.dataset.m;
  openPicker(ex => {
    const w = m === 'e' ? editW : S.active;
    w.exercises.push({ exId: ex.id, sets: [firstSet(ex, lastPerf(ex.id, m === 'e' ? w.start : 0, w.id), m === 'e')] });
    commit(m);
    setTimeout(() => { const cards = document.querySelectorAll(`.card[data-m="${m}"]`); cards.length && cards[cards.length - 1].scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 30);
  });
};
A.exMenu = async b => {
  const c = ctx(b), n = c.w.exercises.length, name = exById(c.e.exId).name;
  const opts = [];
  if (c.ei > 0) opts.push(['上移', 'up']);
  if (c.ei < n - 1) opts.push(['下移', 'down']);
  opts.push(['删除这个动作', 'del', 'fill-danger'], ['取消', 'no']);
  const v = await ask(name, '', opts);
  const a = c.w.exercises;
  if (v === 'up' || v === 'down') {
    const j = c.ei + (v === 'up' ? -1 : 1); [a[c.ei], a[j]] = [a[j], a[c.ei]]; openSet = null; commit(c.m);
    const moved = document.querySelector(`.card[data-m="${c.m}"][data-ei="${j}"]`); moved && moved.scrollIntoView({ block: 'nearest' });
  } else if (v === 'del' && await confirmDanger('删除动作', `删除「${name}」及其 ${c.e.sets.length} 组记录？`)) { a.splice(c.ei, 1); openSet = null; commit(c.m); }
};
A.addSet = b => { const c = ctx(b), l = c.e.sets[c.e.sets.length - 1], ex = exById(c.e.exId);
  c.e.sets.push(l ? { n: c.e.sets.length + 1, w: l.w, r: l.r, done: c.m === 'e' } : firstSet(ex, null, c.m === 'e'));
  if (c.m === 'e') openSet = `e-${c.ei}-${c.e.sets.length - 1}`;
  commit(c.m, b); };
A.delSet = async b => { const c = ctx(b); if (await confirmDanger('删除这一组', `删除「${setLabels(c.e.sets)[c.si]}」（${fmtSet(exById(c.e.exId), c.s)}）？`)) { c.e.sets.splice(c.si, 1); renum(c.e); openSet = null; commit(c.m, b); } };
A.step = b => { const c = ctx(b), d = +b.dataset.d;
  if (b.dataset.f === 'w') c.s.w = Math.max(0, num(c.s.w + d)); else c.s.r = Math.max(1, c.s.r + d);
  commit(c.m, b); };
A.openSet = b => { const c = ctx(b), k = `${c.m}-${c.ei}-${c.si}`; openSet = openSet === k ? null : k; commit(c.m, b); };
A.warm = b => { const c = ctx(b); if (c.s.warm) delete c.s.warm; else c.s.warm = true; commit(c.m, b); };
A.done = b => {

  if (c.s.done) c.s.t = Date.now(); else delete c.s.t;   // 记下每组完成的时间，用来算训练结束时间
  if (c.s.done && c.m === 'a') startTimer(S.settings.rest);
  commit(c.m, b);
  if (c.s.done && c.m === 'a') { const t = prMap(S.active).get(c.s); if (t) toast(`🏆 新纪录！${exById(c.e.exId).name} ${t.map(x => `${x[0]} ${x[1]}（之前 ${x[2]}）`).join('，')}`); }
  if (c.s.done && c.m === 'a') { const cur = document.querySelector(`.card[data-m="a"][data-ei="${c.ei}"] .set.cur`); cur && cur.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }

// 输入框：合法则写入；不合法则标红，失焦时恢复原值并提示
function applyInput(inp, strict) {
  const c = ctx(inp), f = inp.dataset.f, v = f === 'w' ? parseW(inp.value) : parseR(inp.value);
  if (v === null) {
    inp.classList.add('bad');

document.addEventListener('input', e => { if (e.target.matches('input[data-f]')) applyInput(e.target, false); });
// 失焦时只校验不重绘：重绘会吞掉紧接着的按钮点击（例如改完重量直接点“完成”）

// 键盘弹出时收起底部固定栏；收起键盘后把 iOS 顶上去的页面拉回原位

A.finish = async (b, e, quick) => {   // quick：跳过“确定结束吗”的确认
  const w = S.active, all = w.exercises.flatMap(e => e.sets), undone = all.filter(s => !s.done).length;
  if (!all.length) {
    if (await ask('结束训练', '本次训练还没有记录任何组。', [['放弃这次训练', 'x', 'fill-danger'], ['继续训练', 'c']]) === 'x') { S.active = null; S.timer = null; save(); restAudio(0); alarmOff(); render(); }
    return;

  else if (!quick && await ask('结束训练', '确定结束并保存本次训练？', [['结束并保存', 'ok', 'pri'], ['取消', 'c']]) !== 'ok') return;
  const saved = JSON.parse(JSON.stringify(w));

    $('#tprog').style.width = '100%'; $('#tskip').textContent = '关闭'; $('#hpill').textContent = '时间到';

/* 提示音的三种方式（设置里可切换）：
   bg  ：完成一组时开始播放一段“静音 + 结尾提示音”的音频。它作为媒体播放，锁屏、切到别的 App
         时也会继续播，并且不受侧边静音开关影响；代价是会暂停你正在放的音乐。
   mix ：只在打开本工具时用 Web Audio 响一下，不打断音乐；静音开关打开时听不到。
   off ：不出声，只闪屏。 */
const soundMode = () => S.settings.sound || 'bg';
function applyAudioSession() { try { if ('audioSession' in navigator) navigator.audioSession.type = soundMode() === 'mix' ? 'ambient' : 'playback'; } catch (e) {} }
const BEEPS = [0, .3, .6, 1.2, 1.5, 1.8, 2.6, 2.9, 3.2];
// 生成 8kHz 8bit 单声道 WAV：前 sec 秒静音，结尾三连响三次
function makeWav(sec) {
  const sr = 8000, n = Math.round(sr * (sec + 3.6)), buf = new ArrayBuffer(44 + n), v = new DataView(buf);
  const str = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  str(0, 'RIFF'); v.setUint32(4, 36 + n, true); str(8, 'WAVE'); str(12, 'fmt '); v.setUint32(16, 16, true);
  v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, sr, true); v.setUint32(28, sr, true);
  v.setUint16(32, 1, true); v.setUint16(34, 8, true); str(36, 'data'); v.setUint32(40, n, true);
  const d = new Uint8Array(buf, 44); d.fill(128);
  const s0 = Math.round(sr * sec);
  BEEPS.forEach((o, k) => {
    const st = s0 + Math.round(o * sr), len = Math.round(.22 * sr), per = sr / (k % 3 === 2 ? 1320 : 880);
    for (let i = 0; i < len && st + i < n; i++) d[st + i] = 128 + ((i % per) < per / 2 ? 90 : -90);
  });
  return new Blob([buf], { type: 'audio/wav' });
}
let RA = null, RAurl = null;
// 必须在点击里调用（iOS 只允许用户点击触发播放）；sec<=0 表示停止
function restAudio(sec) {
  if (RA) { RA.pause(); RA.removeAttribute('src'); RA.load(); }
  if (RAurl) { URL.revokeObjectURL(RAurl); RAurl = null; }
  if (sec <= 0 || soundMode() !== 'bg') { if ('mediaSession' in navigator) navigator.mediaSession.metadata = null; return; }
  if (!RA) { RA = new Audio(); RA.preload = 'auto'; RA.setAttribute('playsinline', ''); }
  RAurl = URL.createObjectURL(makeWav(Math.min(900, Math.max(1, sec))));
  RA.src = RAurl;
  const p = RA.play(); if (p && p.catch) p.catch(() => toast('提示音被系统拦截了，时间到时只会闪屏', true));
  try { if ('mediaSession' in navigator && window.MediaMetadata) navigator.mediaSession.metadata = new MediaMetadata({ title: '组间休息 ' + Math.round(sec) + ' 秒', artist: '练习记录' }); } catch (e) {}
}

// Web Audio（不打断音乐模式用）：iOS 必须在用户手势里先解锁一次
let AC = null;
function unlockAudio() {
  if (soundMode() !== 'mix') return;
  try {
    if (!AC) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return; AC = new C(); }
    if (AC.state !== 'running') { AC.resume(); const b = AC.createBuffer(1, 1, 22050), s = AC.createBufferSource(); s.buffer = b; s.connect(AC.destination); s.start(0); }
  } catch (e) {}
}
['touchend', 'click'].forEach(ev => document.addEventListener(ev, unlockAudio, { passive: true, capture: true }));
function beep() {
  if (!AC) return;
  try {
    AC.resume(); const t0 = AC.currentTime + 0.05;
    BEEPS.forEach((d, i) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = 'square'; o.frequency.value = i % 3 === 2 ? 1320 : 880;
      g.gain.setValueAtTime(0.0001, t0 + d); g.gain.exponentialRampToValueAtTime(0.35, t0 + d + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + 0.25);
      o.connect(g); g.connect(AC.destination); o.start(t0 + d); o.stop(t0 + d + 0.27);
    });
  } catch (e) {}
}
function alarm(sound) {
  $('#timer').classList.add('alarm');
  const f = $('#flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
  if (sound && soundMode() === 'mix') beep();   // bg 模式下提示音已经在音频结尾里
}
function alarmOff() { $('#timer').classList.remove('alarm'); $('#flash').classList.remove('go'); }
A.sound = b => { S.settings.sound = b.dataset.k; save(); applyAudioSession(); if (S.timer) restAudio(soundMode() === 'bg' ? (S.timer.end - Date.now()) / 1000 : 0); rSet(); };

/* ========== 个人纪录（PR） ==========
   只和这次训练之前的正式组比；第一次练的动作没有可比的，不算纪录。 */
const addBest = (b, s) => { b = b || { w: 0, e1: 0, r: 0, r0: 0 }; return { w: Math.max(b.w, s.w), e1: Math.max(b.e1, s.w * (1 + s.r / 30)), r: Math.max(b.r, s.r), r0: s.w === 0 ? Math.max(b.r0, s.r) : b.r0 }; };
function prevBest(exId, before, skipId) {
  let b = null;
  for (const w of S.workouts) {
    if (w.id === skipId || w.start >= before) continue;
    for (const e of w.exercises) if (e.exId === exId) for (const s of e.sets) if (s.done && !s.warm) b = addBest(b, s);
  }
  return b;
}
// 返回这组破了哪些纪录：[[名称, 新成绩, 之前最好], ...]
function prTypes(ex, s, b) {
  if (!b || !s.done || s.warm) return [];
  if (ex.timed) return s.r > b.r ? [['最长时长', s.r + ' 秒', b.r + ' 秒']] : [];
  const out = [], e1 = s.w * (1 + s.r / 30);
  if (s.w > 0 && s.w > b.w) out.push(['最大重量', num(s.w) + ' kg', num(b.w) + ' kg']);
  else if (s.w > 0 && e1 > b.e1 + 0.05) out.push(['估算 1RM', num(e1) + ' kg', num(b.e1) + ' kg']);
  if (ex.bw && s.w === 0 && b.r0 > 0 && s.r > b.r0) out.push(['单组次数', s.r + ' 次', b.r0 + ' 次']);

  CAT_ORDER.forEach(c => { o.byCat[c] = 0; });
  ws.forEach(w => {
    if (w.end) o.ms += Math.max(0, w.end - w.start);
    w.exercises.forEach(e => {
      const ex = exById(e.exId); if (!ex) return;

        o.sets++; o.byCat[cat]++;

    });
  });

}

    </div>
    <h2>部位分布</h2>
    <div class="card">${rows}<div class="sub" style="margin-top:10px">${esc(hint)}</div></div>
    <h2>近 8 周组数</h2>
    <div class="card">
      <div class="wkchart">${bars.map(b => {
        const h = Math.round(b.a.sets / maxBar * 100), d = new Date(b.s);
        return `<div class="wkbar"><span class="wknum">${b.a.sets || ''}</span><div class="wkfill"><i style="height:${b.a.sets ? Math.max(3, h) : 2}%${b.a.sets ? '' : ';opacity:.22'}"></i></div><span class="wklab">${d.getMonth() + 1}/${d.getDate()}</span></div>`;
      }).join('')}</div>
      <div class="sub" style="margin-top:10px">本周 ${thisWk} 组，上周 ${prev} 组${dSets ? `（${dSets > 0 ? '多' : '少'}了 ${Math.abs(dSets)} 组）` : ''}。每根柱子是一周，从左到右由早到晚。热身组不算。</div>
    </div>`;
  $('#hdr').textContent = `共 ${S.workouts.length} 次`;
}

/* ========== 总渲染与启动 ========== */
function render() {
  $('#title').textContent = TITLES[tab];
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  ({ train: rTrain, history: rHist, progress: rProg, stats: rStat, settings: rSet })[tab]();
  renderTimer();
}
document.addEventListener('click', e => { const b = e.target.closest('[data-a]'); if (b && !b.disabled && A[b.dataset.a]) A[b.dataset.a](b, e); });
setInterval(() => { if (S.timer) renderTimer(); updElapsed(); autoEnd(); }, 500);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { if (AC) AC.resume().catch(() => {}); renderTimer(); updElapsed(); setTimeout(autoEnd, 400); } });
window.addEventListener('pageshow', () => { renderTimer(); updElapsed(); });
// 运行时生成主屏幕图标（PNG data URL，不依赖外部文件）
(function icon() {
  try {
    const c = document.createElement('canvas'); c.width = c.height = 180; const g = c.getContext('2d');
    g.fillStyle = '#0a6cff'; g.fillRect(0, 0, 180, 180);
    g.strokeStyle = '#fff'; g.lineCap = 'round'; g.lineWidth = 16;
    [[50, 52, 128], [130, 52, 128], [28, 72, 108], [152, 72, 108]].forEach(([x, a, b]) => { g.beginPath(); g.moveTo(x, a); g.lineTo(x, b); g.stroke(); });
    g.lineWidth = 12; g.beginPath(); g.moveTo(50, 90); g.lineTo(130, 90); g.stroke();
    $('#touchIcon').href = c.toDataURL('image/png');
  } catch (e) {}
})();
S = load();
applyAudioSession(); syncVV();
render();
// 打开时先看是不是早该结束了；没结束才提示“已恢复”
setTimeout(() => { autoEnd(); if (S.active && !document.querySelector('.ov')) toast('已恢复进行中的训练'); }, 300);

/* ========== 离线支持 ========== */
// 只有 https / localhost 能注册 Service Worker；双击打开本地文件时自动跳过，不影响使用
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
</body>
