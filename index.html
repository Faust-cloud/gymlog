<style>
:root{--bg:#f2f2f7;--card:#fff;--card2:#ececf1;--text:#0b0b0f;--sub:#55555f;--line:#cfcfd8;--acc:#0a6cff;--ok:#178a46;--danger:#d92d20;--warn:#a85f00;--cur:#e3eeff;--tab:#fafafc;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#17171b;--card2:#26262d;--text:#f5f5f7;--sub:#a8a8b3;--line:#3a3a44;--acc:#3d9bff;--ok:#36c96d;--danger:#ff5a4f;--warn:#ffb340;--cur:#0d2a4d;--tab:#17171b}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;-webkit-text-size-adjust:100%}
html{touch-action:manipulation}
body{overscroll-behavior-y:none}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{touch-action:manipulation;cursor:pointer}
button:disabled{opacity:.35}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;min-height:52px;padding:calc(env(safe-area-inset-top) + 6px) max(16px,env(safe-area-inset-right)) 6px max(16px,env(safe-area-inset-left))}
h1{font-size:24px;margin:0;font-weight:800}
h2{font-size:17px;margin:18px 4px 6px}
main{overflow-x:clip;padding:0 max(12px,env(safe-area-inset-right)) calc(84px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
body.timer-on main{padding-bottom:calc(160px + env(safe-area-inset-bottom))}
/* 键盘弹出时收起底部固定栏，避免它们浮到键盘上方挡住输入框 */
body.kb nav.tabs,body.kb #timer{display:none!important}
body.kb main{padding-bottom:24px}
#hpill{display:none;margin-left:8px;padding:4px 10px;border-radius:12px;background:var(--acc);color:#fff;font-weight:700;font-variant-numeric:tabular-nums}
body.timer-on.kb #hpill{display:inline-block}
.hright{display:flex;align-items:center}
.btn{min-height:44px;min-width:44px;border:0;border-radius:12px;font-size:16px;font-weight:600;background:var(--card2);color:var(--text);padding:0 14px}
.btn.pri{background:var(--acc);color:#fff}
.btn.danger{color:var(--danger)}
.btn.pri.danger,.btn.fill-danger{background:var(--danger);color:#fff}
.btn.big{display:block;width:100%;min-height:56px;font-size:18px;margin-top:10px}
.btn.ghost{background:none;color:var(--sub);font-weight:500}
.card{background:var(--card);border-radius:16px;padding:12px;margin:10px 0}
.exh{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.exh>div:first-child,.li>div:first-child{min-width:0;overflow-wrap:anywhere}
.exn{font-size:19px;font-weight:800}
.exb{display:flex;gap:4px;flex-shrink:0}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:1px 6px;border-radius:6px;background:var(--card2);color:var(--sub);vertical-align:middle}
.sub{color:var(--sub);font-size:14px}
.set{display:grid;grid-template-columns:minmax(0,1fr) 66px;gap:6px 8px;padding:8px;border-radius:12px;border:2px solid transparent;margin-top:8px;background:var(--card2)}
.set.cur{border-color:var(--acc);background:var(--cur);scroll-margin:70px 0 170px}
/* 热身组：橙色虚线边框，一眼和正式组区分开 */
.set.warm{border:2px dashed var(--warn)}
.set.warm .sethead>span:first-child,.set.mini.warm .mini-main{color:var(--warn)}
.sethead{flex-wrap:wrap;gap:0 4px}
.warmbtn{padding:0 8px}
.set.done .chk{background:var(--ok);color:#fff}
/* 已完成的组折叠成一行，点一下展开修改 */
.set.mini{display:flex;align-items:center;gap:8px;padding:4px 4px 4px 0;background:none;border:1px solid var(--line)}
.mini-main{flex:1;min-width:0;min-height:44px;border:0;background:none;text-align:left;padding:0 10px;color:var(--sub);font-size:15px}
.mini-main b{color:var(--text);font-size:17px;margin-left:6px}
.mini-ok{width:48px;min-width:48px;padding:0;background:var(--ok);color:#fff;font-size:18px}
.prev{font-weight:500;color:var(--sub);font-size:13px;margin-left:8px}
.set.mini.warm{border:1px dashed var(--warn)}
.sethead{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;font-weight:700;padding-left:4px}
.stp{grid-column:1;display:flex;align-items:center;gap:5px}
.stp label{width:34px;color:var(--sub);font-size:14px;flex-shrink:0}
.stp input{flex:1 1 0;width:0;min-width:0;height:44px;font-size:20px;font-weight:700;text-align:center;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:0 2px}
.stp .btn{padding:0;width:50px;min-width:50px;font-size:15px;background:var(--card)}
.unit{width:20px;color:var(--sub);font-size:13px;flex-shrink:0}
.chk{grid-column:2;grid-row:2;min-height:44px;font-size:16px;line-height:1.2;background:var(--card);border:2px solid var(--ok)!important;color:var(--ok)}
/* 没数：按预填次数记成“约 N 次” */
.estbtn{grid-column:2;grid-row:3;min-height:44px;padding:0;font-size:14px;line-height:1.15;background:var(--card);border:1px dashed var(--sub)!important;color:var(--sub)}
.estbtn small{display:block;font-size:11px;font-weight:500}
/* 多久没练 */
.gap{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.gapi{background:var(--card2);border-radius:10px;padding:6px 10px;font-size:14px}
.gapi b{margin-left:4px}
.gapi.old{background:var(--cur);color:var(--acc)}
.gapi.fresh{opacity:.5}
.chip small{font-size:11px;font-weight:500;opacity:.8;margin-left:3px}
.secth{font-size:13px;font-weight:700;color:var(--sub);margin:14px 4px 2px}
input.bad{border-color:var(--danger)!important;box-shadow:0 0 0 2px var(--danger)}
.addset{width:100%;margin-top:8px;border:1px dashed var(--line);background:none}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--tab);transform:translateZ(0);border-top:1px solid var(--line);padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.tabs button{flex:1;min-height:58px;background:none;border:0;color:var(--sub);font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tabs button.on{color:var(--acc)}
.tabs svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#timer{display:none;position:fixed;z-index:19;left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));bottom:calc(64px + env(safe-area-inset-bottom));background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 6px 0 0;box-shadow:0 4px 16px rgba(0,0,0,.2);overflow:hidden;transform:translateZ(0)}
body.timer-on #timer{display:block}
#timer .row{display:flex;gap:6px;align-items:center;min-height:58px}
.tnum{flex:1;min-width:0;border:0;background:none;text-align:left;padding:4px 10px;line-height:1.1}
.tnum span{display:block;font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.tlab{font-size:12px;color:var(--sub);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#timer .row .btn{padding:0 10px;flex-shrink:0}
.prog{position:absolute;left:0;right:0;top:0;height:4px;background:var(--line)}
.prog i{display:block;height:100%;width:100%;background:var(--acc);transform:scaleX(0);transform-origin:left;will-change:transform}
.chips{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.chip{flex-shrink:0;min-height:44px;min-width:56px;border-radius:22px;border:1px solid var(--line);background:var(--card2);font-size:15px;font-weight:600;padding:0 12px}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
#timer.alarm{animation:fl 1.2s ease-in-out infinite alternate;border-color:transparent}
#timer.alarm .tlab,#timer.alarm .tnum{color:inherit}
@keyframes fl{0%{background:var(--danger);color:#fff}100%{background:var(--warn);color:#000}}
#flash{position:fixed;inset:0;z-index:18;pointer-events:none;opacity:0;background:var(--danger);will-change:opacity}
#flash.go{animation:fl2 1s ease-in-out 3}
@keyframes fl2{0%,100%{opacity:0}50%{opacity:.25}}
/* 弹层跟随“可见视口”定位：键盘弹出时整体上移，不会被键盘挡住 */
.ov{position:fixed;left:0;right:0;top:var(--vvt,0px);height:var(--vvh,100%);z-index:50;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;overscroll-behavior:contain}
.ov.c{align-items:center;justify-content:center;padding:24px}
.sheet{background:var(--bg);width:100%;max-height:calc(var(--vvh,100vh) - 36px);border-radius:18px 18px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.sheet.full{height:100%;max-height:none;border-radius:0;padding-top:env(safe-area-inset-top)}
.sb{overscroll-behavior:contain}
input[type="datetime-local"]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;text-align:left;line-height:46px}
.sh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
.sh b{font-size:18px}
.sb{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 12px 24px;flex:1}
.dlg{background:var(--card);border-radius:18px;padding:20px;width:100%;max-width:360px;max-height:85vh;overflow-y:auto}
.dlg h3{margin:0 0 8px;font-size:19px}
.dlg p{margin:0;white-space:pre-line}
.bts{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.bts .btn{min-height:50px}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translateX(-50%);z-index:100;background:rgba(30,30,34,.96);color:#fff;padding:12px 16px;border-radius:14px;max-width:90%;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;text-align:center}
#toast.show{opacity:1}
#toast.err{background:var(--danger)}
.li{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:54px;padding:10px 12px;background:var(--card);border:0;border-radius:14px;margin:8px 0;font-size:16px;text-align:left}
.li .t{font-weight:700}
.tip{background:var(--cur);border-radius:14px;padding:14px;margin:10px 0}
.tip.warn{background:transparent;border:2px solid var(--warn)}
.tip ol{margin:8px 0 0;padding-left:22px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.stat{background:var(--card2);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;gap:3px;margin:10px 0}
.seg button{flex:1;min-height:44px;border:0;background:none;border-radius:10px;font-size:14px;font-weight:600;padding:0 4px}
.seg button.on{background:var(--card);color:var(--acc);box-shadow:0 1px 4px rgba(0,0,0,.15)}
select,.txt{width:100%;min-height:48px;font-size:16px;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:0 12px}
.lbl{display:block;font-weight:700;margin:14px 0 6px}
.chkrow{display:flex;align-items:center;gap:10px;min-height:48px;font-size:16px}
.chkrow input{width:24px;height:24px}
canvas{display:block;width:100%;height:260px;touch-action:manipulation}
.cinfo{min-height:44px;padding:8px 4px;font-weight:600}
.row2{display:flex;gap:8px}
.row2 .btn{flex:1}
.exline{padding:6px 0;border-bottom:1px solid var(--line)}
.exline:last-child{border-bottom:0}
/* 统计页 */
.catrow{display:flex;align-items:center;gap:10px;margin:9px 0}
.catname{width:44px;flex-shrink:0;font-size:14px;font-weight:700}
.catbar{flex:1;height:10px;border-radius:5px;background:var(--card2);overflow:hidden}
.catbar i{display:block;height:100%;background:var(--acc);border-radius:5px;transition:width .25s}
.catnum{width:52px;flex-shrink:0;text-align:right;font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.wkchart{display:flex;align-items:stretch;gap:5px;height:132px}
.wkbar{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.wkfill{flex:1;width:100%;display:flex;align-items:flex-end}
.wkfill i{width:100%;background:var(--acc);border-radius:5px 5px 2px 2px;min-height:2px}
html[lang=en] .catname{width:78px}html[lang=en] .catnum{width:60px}
.wknum,.wklab{font-size:10px;color:var(--sub);white-space:nowrap;font-variant-numeric:tabular-nums;height:13px;line-height:13px}
</style>
</head>
<body>

function migrate(d) {
  if (!d || typeof d !== 'object') throw new Error(L('数据格式错误', 'Invalid data format'));
  const s = defState();
  if (Array.isArray(d.exercises)) s.exercises = d.exercises;

  builtins().forEach(b => {

  if (d.exercises.some(e => !e || typeof e.id !== 'string' || typeof e.name !== 'string')) return L('动作库数据有误', 'Exercise data is invalid');
  for (const w of d.workouts.concat(d.active ? [d.active] : [])) {
    if (!w || typeof w.id !== 'string' || typeof w.start !== 'number' || !Array.isArray(w.exercises)) return L('训练记录格式有误', 'Workout data is invalid');
    for (const e of w.exercises) {
      if (!e || typeof e.exId !== 'string' || !Array.isArray(e.sets)) return L('动作记录格式有误', 'Exercise entries are invalid');
      for (const s of e.sets) if (!s || typeof s.w !== 'number' || !(s.w >= 0) || !Number.isInteger(s.r) || s.r < 1) return L('组数据有误（重量需 ≥0，次数需为正整数）', 'Set data is invalid (weight ≥ 0, reps a positive whole number)');
    }
  }
  return null;
}
$('#file').addEventListener('change', async e => { const f = e.target.files[0]; if (f) importText(await f.text()); });
A.paste = () => {
  const ov = sheet(L('粘贴备份文本', 'Paste backup'), `<button class="btn pri" data-x="go">${L('导入', 'Import')}</button>`);
  ov.body.innerHTML = `<div class="sub">${L('把备份的全部文字粘贴到下面。可以在 Mac 上复制，然后在 iPhone 上直接长按粘贴（两台设备需登录同一个 Apple ID）。', 'Paste the full backup text below. You can copy it on a Mac and long-press to paste on your iPhone (same Apple ID on both).')}</div>
    <textarea class="txt" data-x="t" style="height:50vh;padding:10px;margin-top:8px;font-size:16px" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${L('长按这里 → 粘贴', 'Long-press here → Paste')}"></textarea>`;
  ov.querySelector('[data-x="go"]').addEventListener('click', async () => {
    const t = ov.querySelector('[data-x="t"]').value.trim();
    if (!t) return toast(L('请先粘贴内容', 'Paste something first'), true);
    if (await importText(t)) ov.close();
  });
};
// 文件导入和粘贴导入共用：解析 → 校验 → 确认覆盖 → 写入（失败则回滚）
async function importText(txt) {
  const FAIL = L('导入失败', 'Import failed'), KEPT = L('当前数据未改动。', ' Your current data is unchanged.');
  let p;
  try { p = JSON.parse(txt); } catch (err) { ask(FAIL, L('内容无法解析，不是有效的备份（可能没有复制完整）。', 'Could not read this as a backup (maybe it was not copied in full).') + KEPT); return false; }
  const err = validateBackup(p); if (err) { ask(FAIL, err + L('。', '.') + KEPT); return false; }
  const d = p.data, nc = d.exercises.filter(x => x.custom).length, when = p.exportedAt ? fmtDT(Date.parse(p.exportedAt)) : L('未知时间', 'an unknown time');
  if (!await confirmDanger(L('将覆盖当前数据', 'Replace current data'), L(`备份导出于 ${when}，包含 ${d.workouts.length} 次训练、${nc} 个自定义动作。\n导入会覆盖当前的全部数据，确定继续？`, `Exported ${when}, with ${d.workouts.length} workouts and ${nc} custom exercises.\nImporting replaces all current data. Continue?`), L('覆盖并导入', 'Replace & import'))) return false;
  const old = S;
  try { S = migrate(d); } catch (er) { S = old; ask(FAIL, er.message); return false; }
  if (!save()) { S = old; return false; }
  alarmOff(); restAudio(0); applyAudioSession(); toast(L('导入成功', 'Imported')); render();
  return true;
}
A.wipe = async () => {
  if (!await confirmDanger(L('清空所有数据', 'Erase all data'), L('将删除全部训练记录、自定义动作和设置。建议先导出备份。', 'This deletes every workout, custom exercise and setting. Export a backup first.'), L('继续', 'Continue'))) return;
  if (!await confirmDanger(L('再次确认', 'Are you sure?'), L('真的要清空吗？此操作无法撤销。', 'Really erase everything? This can’t be undone.'), L('永久清空', 'Erase forever'))) return;
  S = defState(); restAudio(0); alarmOff(); if (save()) { toast(L('已清空', 'Erased')); render(); }
};

/* ========== 统计页 ========== */
const WEEK_MS = 7 * DAY, CAT_ORDER = ['胸', '背', '腿', '肩', '手臂', '核心'];
// 周一 0 点为一周起点
const weekStart = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime() - ((d.getDay() + 6) % 7) * DAY; };
let stRange = 7;
// 统计也算上正在进行的训练，练到一半来看不会少算
const allW = () => S.workouts.concat(S.active ? [S.active] : []);

// 把一批训练汇总成：次数、组数、容量、时长、各部位组数（热身组不算）
function agg(ws) {
  const o = { n: ws.length, sets: 0, vol: 0, ms: 0, byCat: {} };
  CAT_ORDER.forEach(c => { o.byCat[c] = 0; });
  ws.forEach(w => {
    if (w.end) o.ms += Math.max(0, w.end - w.start);
    w.exercises.forEach(e => {
      const ex = exById(e.exId); if (!ex) return;
      const cat = ex.cat || '其他';
      if (o.byCat[cat] === undefined) o.byCat[cat] = 0;
      e.sets.forEach(s => {
        if (!s.done || s.warm) return;
        o.sets++; o.byCat[cat]++;
        if (!ex.timed) o.vol += s.w * s.r;
      });
    });
  });
  o.vol = num(o.vol);
  return o;
}
A.stRange = b => { stRange = Number(b.dataset.r); render(); };

function rStat() {
  const m = $('#main'), now = Date.now(), ws = allW();
  if (!ws.length) {
    m.innerHTML = `<div class="tip">${L('📊 练过几次之后，这里会显示：这段时间练了多少组、各部位练得均不均衡、近两个月的训练量走势。', '📊 After a few workouts, this shows how many sets you did, how balanced your muscle groups are, and your trend over the last two months.')}</div><button class="btn pri big" data-a="tab" data-tab="train">${L('去训练', 'Start training')}</button>`;
    $('#hdr').textContent = ''; return;
  }
  const w0 = weekStart(now), from = w0 - (stRange === 7 ? 0 : 21 * DAY);
  const cur = agg(ws.filter(w => w.start >= from));

  // 近 8 周走势（最后一根是本周）
  const bars = [];
  for (let i = 7; i >= 0; i--) {
    const s = w0 - i * WEEK_MS;
    bars.push({ s, a: agg(ws.filter(w => w.start >= s && w.start < s + WEEK_MS)) });
  }
  const maxBar = Math.max(1, ...bars.map(b => b.a.sets));
  // 本周 / 上周固定取最后两根柱子，不随“本周 / 近 4 周”切换而变
  const thisWk = bars[bars.length - 1].a.sets, prev = bars[bars.length - 2].a.sets, dSets = thisWk - prev;

  // 部位分布
  const cats = CAT_ORDER.concat(Object.keys(cur.byCat).filter(c => !CAT_ORDER.includes(c)));
  const maxCat = Math.max(1, ...cats.map(c => cur.byCat[c] || 0));
  const rows = cats.map(c => {
    const v = cur.byCat[c] || 0;
    return `<div class="catrow"><span class="catname">${esc(catName(c))}</span><div class="catbar"><i style="width:${Math.round(v / maxCat * 100)}%${v ? '' : ';background:var(--line)'}"></i></div><span class="catnum">${setsTxt(v)}</span></div>`;
  }).join('');

  // 平衡提示：只提醒“最近 6 周里练过、但这段时间没练”的部位，避免每次都说没练核心
  const recent = new Set(ws.filter(w => w.start >= now - 42 * DAY)
    .flatMap(w => w.exercises.map(e => (exById(e.exId) || {}).cat)).filter(Boolean));
  const trained = cats.map(c => ({ c, v: cur.byCat[c] || 0 })).filter(x => x.v > 0);
  let hint = '';
  if (trained.length) {
    const hi = trained.reduce((a, b) => (a.v > b.v ? a : b)), lo = trained.reduce((a, b) => (a.v < b.v ? a : b));
    hint = (hi.v >= lo.v * 3 && hi.v - lo.v >= 6) ? L(`${hi.c} ${hi.v} 组，${lo.c} 只有 ${lo.v} 组，差得有点多。`, `${catName(hi.c)} ${setsTxt(hi.v)} vs ${catName(lo.c)} only ${lo.v}: quite a gap.`) : L('练得还算均衡。', 'Fairly balanced.');
  }
  const miss = cats.filter(c => !cur.byCat[c] && recent.has(c));
  if (miss.length) hint += `${hint ? ' ' : ''}${L(`${stRange === 7 ? '本周' : '这 4 周'}还没练：${miss.join('、')}。`, `Not trained ${stRange === 7 ? 'this week' : 'in these 4 weeks'}: ${miss.map(catName).join(', ')}.`)}`;

  m.innerHTML = `
    <div class="seg">${[[7, L('本周', 'This week')], [28, L('近 4 周', 'Last 4 weeks')]].map(([k, t]) => `<button class="${stRange === k ? 'on' : ''}" data-a="stRange" data-r="${k}">${t}</button>`).join('')}</div>
    <div class="stats">${statBox(L('训练次数', 'Workouts'), cur.n)}${statBox(L('总组数', 'Sets'), cur.sets)}${statBox(L('总容量', 'Volume'), cur.vol ? fmtKg(cur.vol) : '—')}${statBox(L('累计时长', 'Time'), cur.ms ? fmtDur(cur.ms) : '—')}</div>
    <h2>${L('部位分布', 'By muscle group')}</h2>
    <div class="card">${rows}<div class="sub" style="margin-top:10px">${esc(hint)}</div></div>
    <h2>${L('近 8 周组数', 'Sets per week (8 weeks)')}</h2>
    <div class="card">
      <div class="wkchart">${bars.map(b => {
        const h = Math.round(b.a.sets / maxBar * 100), d = new Date(b.s);
        return `<div class="wkbar"><span class="wknum">${b.a.sets || ''}</span><div class="wkfill"><i style="height:${b.a.sets ? Math.max(3, h) : 2}%${b.a.sets ? '' : ';opacity:.22'}"></i></div><span class="wklab">${d.getMonth() + 1}/${d.getDate()}</span></div>`;
      }).join('')}</div>
      <div class="sub" style="margin-top:10px">${L(`本周 ${thisWk} 组，上周 ${prev} 组${dSets ? `（${dSets > 0 ? '多' : '少'}了 ${Math.abs(dSets)} 组）` : ''}。每根柱子是一周，从左到右由早到晚。热身组不算。`, `${setsTxt(thisWk)} this week, ${prev} last week${dSets ? ` (${dSets > 0 ? '+' : '−'}${Math.abs(dSets)})` : ''}. Each bar is one week, oldest on the left. Warm-ups not counted.`)}</div>
    </div>`;
  $('#hdr').textContent = L(`共 ${S.workouts.length} 次`, `${S.workouts.length} total`);
}

/* ========== 总渲染与启动 ========== */
function render() {
  $('#title').textContent = TITLES[tab];
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  ({ train: rTrain, history: rHist, progress: rProg, stats: rStat, settings: rSet })[tab]();
  renderTimer();
}
document.addEventListener('click', e => { const b = e.target.closest('[data-a]'); if (b && !b.disabled && A[b.dataset.a]) A[b.dataset.a](b, e); });
setInterval(() => { if (S.timer) renderTimer(); updElapsed(); autoEnd(); }, 500);
/* 切回 App：iOS 刚恢复页面时还在重新排版，这时立刻改页面容易出现错位、撕裂。
   等两帧再刷新；顺便清掉离开时没来得及收起的“键盘弹出”状态，并校正可见区域。
   提示音不在这里重新生成（不是点击，iOS 不让播，还会白白卡一下），等下一次点屏幕再接上 */
let resumeQ = false;
function onResume() {
  if (resumeQ) return; resumeQ = true;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    resumeQ = false;
    if (!isField(document.activeElement)) document.body.classList.remove('kb');
    syncVV(); if (AC) AC.resume().catch(() => {});
    renderTimer(); updElapsed(); if (tab === 'progress') drawChart();
    setTimeout(autoEnd, 400);
  }));
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) onResume(); });
window.addEventListener('pageshow', onResume);
// 运行时生成主屏幕图标（PNG data URL，不依赖外部文件）
(function icon() {
  try {
    const c = document.createElement('canvas'); c.width = c.height = 180; const g = c.getContext('2d');
    g.fillStyle = '#0a6cff'; g.fillRect(0, 0, 180, 180);
    g.strokeStyle = '#fff'; g.lineCap = 'round'; g.lineWidth = 16;
    [[50, 52, 128], [130, 52, 128], [28, 72, 108], [152, 72, 108]].forEach(([x, a, b]) => { g.beginPath(); g.moveTo(x, a); g.lineTo(x, b); g.stroke(); });
    g.lineWidth = 12; g.beginPath(); g.moveTo(50, 90); g.lineTo(130, 90); g.stroke();
    $('#touchIcon').href = c.toDataURL('image/png');
  } catch (e) {}
})();
// 按界面语言改写页面里写死的文字
document.documentElement.lang = L('zh-CN', 'en'); document.title = L('练习记录', 'gymlog');
document.querySelectorAll('#tabs button span').forEach(s => { s.textContent = TITLES[s.parentNode.dataset.tab]; });
[['[data-d="-15"]', L('减 15 秒', 'Minus 15 seconds')], ['[data-d="15"]', L('加 15 秒', 'Plus 15 seconds')]].forEach(([q, t]) => $('#timer ' + q).setAttribute('aria-label', t));
S = load();
applyAudioSession(); syncVV();
render();
// 打开时先看是不是早该结束了；没结束才提示“已恢复”
setTimeout(() => { autoEnd(); if (S.active && !document.querySelector('.ov')) toast(L('已恢复进行中的训练', 'Resumed your workout in progress')); }, 300);

/* ========== 离线支持 ========== */
// 只有 https / localhost 能注册 Service Worker；双击打开本地文件时自动跳过，不影响使用
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  // 新版离线缓存接管后刷新一次。只在页面切到后台时悄悄刷，用户看不到白屏闪一下；手动「检查更新」照常立刻刷新
  const hadCtrl = !!navigator.serviceWorker.controller;
  let reloaded = false;
  const busy = () => (S.timer && S.timer.end > Date.now() - 60000) || document.querySelector('.ov') || document.body.classList.contains('kb');
  let pending = false;
  const tryReload = () => { if (reloaded || busy()) return; reloaded = true; location.reload(); };
  document.addEventListener('visibilitychange', () => { if (pending && document.hidden) tryReload(); });
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadCtrl) pending = true; });
}
// 手动更新：清掉离线缓存后从网上重新加载。训练数据存在别处，不受影响
A.update = async () => {
  if (!navigator.onLine) return toast(L('现在没网，联网后再检查更新', 'You are offline. Try again when connected'), true);
  toast(L('正在检查更新…', 'Checking for updates…'));
  try {
    if ('caches' in window) { const ks = await caches.keys(); await Promise.all(ks.map(k => caches.delete(k))); }
    const r = navigator.serviceWorker && await navigator.serviceWorker.getRegistration(); if (r) await r.update();
  } catch (e) {}
  location.reload();
};
</script>
